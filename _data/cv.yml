          - "Thesis: Object Detection with Neural Networks for Robotics Applications: Training Methods Compared."
          - "Supervisor: Prof. C. Natale."

    Projects:
      - name: Policy Gradient RL on VLAs
        start_date: 2026-07-01
        end_date: 2026-07-01
        summary: >
          Running policy gradient RL on large VLAs on the OGBench dataset.

      - name: VLA Latent Space Investigation
        start_date: 2026-01-01
        end_date: 2026-01-01
        summary: >
          Reproduced a feature-based VLA failure detector and evaluated latent-space
          interventions for modifying policy behavior in simulation. Measured their
          impact on task success and found no consistent improvement in task success
          rate.

      - name: Advantage-Conditioned VLA Learning
        start_date: 2025-12-01
        end_date: 2025-12-01
        summary: >
          Implemented a RECAP-style training pipeline using a pretrained VLM to
          generate zero-shot value estimates from rollout observations, converted
          the estimates into advantages, and fine-tuned a VLA conditioned on those
          advantages.

